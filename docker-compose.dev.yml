# Локальная тестовая / dev-среда: отдельные порты, чтобы не конфликтовать с prod-стеком на :80 и :5432
# Запуск: docker compose -f docker-compose.dev.yml up -d --build
# UI: http://localhost:8888  |  API: http://localhost:8080/api  |  Postgres (хост): localhost:5433

name: game-planner-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: game-planner-db-dev
    environment:
      POSTGRES_DB: game_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - game-planner-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./game-planner-back
      dockerfile: Dockerfile
    container_name: game-planner-backend-dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/game_planner
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production-min-256-bits}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1,http://localhost:8888}
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-true}
      CLEANUP_RETENTION_DAYS: ${CLEANUP_RETENTION_DAYS:-15}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 0 3 * * ?}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_CHAT_ID: ${TELEGRAM_BOT_CHAT_ID:-}
      TELEGRAM_BOT_THREAD_ID: ${TELEGRAM_BOT_THREAD_ID:-}
      TELEGRAM_BOT_TIMEZONE: ${TELEGRAM_BOT_TIMEZONE:-Europe/Moscow}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8888}
      TELEGRAM_NOTIFICATIONS_SCHEDULED_ENABLED: ${TELEGRAM_NOTIFICATIONS_SCHEDULED_ENABLED:-true}
      TELEGRAM_NOTIFICATIONS_CHECK_INTERVAL: ${TELEGRAM_NOTIFICATIONS_CHECK_INTERVAL:-60000}
      TELEGRAM_GROUP_TIME_SLOT_REMINDER_ENABLED: ${TELEGRAM_GROUP_TIME_SLOT_REMINDER_ENABLED:-false}
      TELEGRAM_GROUP_TIME_SLOT_REMINDER_CRON: "${TELEGRAM_GROUP_TIME_SLOT_REMINDER_CRON:-0 0 0 * * ?}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - game-planner-dev
    restart: unless-stopped

  frontend:
    build:
      context: ./game-planer-front
      dockerfile: Dockerfile
    container_name: game-planner-frontend-dev
    depends_on:
      - backend
    networks:
      - game-planner-dev
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: game-planner-caddy-dev
    ports:
      - "8888:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - game-planner-dev
    restart: unless-stopped

volumes:
  postgres_dev_data:
  caddy_dev_data:
  caddy_dev_config:

networks:
  game-planner-dev:
    driver: bridge
