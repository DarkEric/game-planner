version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: game-planner-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - game-planner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./game-planner-back
      dockerfile: Dockerfile
    container_name: game-planner-backend-prod
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-true}
      CLEANUP_RETENTION_DAYS: ${CLEANUP_RETENTION_DAYS:-15}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 0 3 * * ?}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_CHAT_ID: ${TELEGRAM_BOT_CHAT_ID:-}
      TELEGRAM_BOT_THREAD_ID: ${TELEGRAM_BOT_THREAD_ID:-}
      TELEGRAM_BOT_TIMEZONE: ${TELEGRAM_BOT_TIMEZONE:-Europe/Moscow}
      TELEGRAM_BOT_PROXY_ENABLED: ${TELEGRAM_BOT_PROXY_ENABLED:-false}
      TELEGRAM_BOT_PROXY_HOST: ${TELEGRAM_BOT_PROXY_HOST:-}
      TELEGRAM_BOT_PROXY_PORT: ${TELEGRAM_BOT_PROXY_PORT:-1080}
      TELEGRAM_BOT_PROXY_USERNAME: ${TELEGRAM_BOT_PROXY_USERNAME:-}
      TELEGRAM_BOT_PROXY_PASSWORD: ${TELEGRAM_BOT_PROXY_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL}
      TELEGRAM_NOTIFICATIONS_SCHEDULED_ENABLED: ${TELEGRAM_NOTIFICATIONS_SCHEDULED_ENABLED:-true}
      TELEGRAM_NOTIFICATIONS_CHECK_INTERVAL: ${TELEGRAM_NOTIFICATIONS_CHECK_INTERVAL:-60000}
      TELEGRAM_GROUP_TIME_SLOT_REMINDER_ENABLED: ${TELEGRAM_GROUP_TIME_SLOT_REMINDER_ENABLED:-false}
      TELEGRAM_GROUP_TIME_SLOT_REMINDER_CRON: "${TELEGRAM_GROUP_TIME_SLOT_REMINDER_CRON:-0 0 0 * * ?}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - game-planner-network
    restart: always

  frontend:
    build:
      context: ./game-planer-front
      dockerfile: Dockerfile
    container_name: game-planner-frontend-prod
    depends_on:
      - backend
    networks:
      - game-planner-network
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: game-planner-caddy-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - game-planner-network
    restart: always

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  game-planner-network:
    driver: bridge
